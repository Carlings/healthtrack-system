name: CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./HealthTrack.sln

      - name: Build
        run: dotnet build ./HealthTrack.sln -c Release --no-restore

      - name: Test
        run: dotnet test ./HealthTrack.sln -c Release --no-build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login -n ${{ secrets.ACR_NAME }}

      - name: Build & Push API Image
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/healthtrack-api:${GITHUB_SHA}"
          docker build -f HealthTrack.Api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "API_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy API (Azure Container Apps)
        run: |
          az containerapp update \
            -g "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            -n "${{ secrets.ACA_API_NAME }}" \
            --image "$API_IMAGE"